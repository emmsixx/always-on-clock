name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            artifact: linux
            bundle-path: src-tauri/target/release/bundle/
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
            bundle-path: src-tauri/target/aarch64-apple-darwin/release/bundle/
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
            bundle-path: src-tauri/target/x86_64-apple-darwin/release/bundle/
          - platform: windows-latest
            args: ''
            artifact: windows
            bundle-path: src-tauri/target/release/bundle/

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target (macOS ARM)
        if: matrix.args == '--target aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      - name: Install Rust target (macOS Intel)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && 'true' || '' }}
        with:
          args: ${{ matrix.args }}

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.AppImage' -o \
              -name '*.msi' -o \
              -name '*-setup.exe' \
            \) -print0 | sort -z
          )
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi

          release_args=(
            --title "Always On Clock ${GITHUB_REF_NAME}"
            --notes "Test build for ${GITHUB_REF_NAME}. See the attached platform installers below."
          )

          if [[ "${RELEASE_IS_PRERELEASE}" == 'true' ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${release_args[@]}"
